<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account · project1</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- TASK-AUTH-01-01 · Sign-Up page, English variant — Active look.
       Target = user export docs/figma/Sign Up 1.png (Figma page "Sign Up (Active)", frame 61:19). -->
  <main class="stage" aria-label="Create account">

    <!-- Left brand panel (teal) -->
    <img class="logo" src="assets/logo.png" alt="" width="48" height="48">
    <p class="tagline">Find 3D Objects,<br>Mckups and Illustration here.</p>

    <!-- Right card -->
    <section class="card" aria-label="Sign up form">

      <div class="lang">
        <span class="lang-text">English (UK)</span>
        <img class="lang-chevron" src="assets/chevron.png" alt="" width="8" height="4">
      </div>

      <h1 class="heading">Create Account</h1>

      <div class="sso-row">
        <button type="button" class="sso sso-google">
          <img class="sso-icon" src="assets/icon-google.png" alt="" width="22" height="22">
          <span class="sso-label">Sign Up With Google</span>
        </button>
        <button type="button" class="sso sso-facebook">
          <img class="sso-icon" src="assets/icon-facebook.png" alt="" width="22" height="22">
          <span class="sso-label">Sign Up With Facebook</span>
        </button>
      </div>

      <p class="or" aria-hidden="true">- OR -</p>

      <form class="signup-form" novalidate>

        <div class="field" data-field>
          <img class="field-icon icon-account" src="assets/chip-account.png" alt="" aria-hidden="true">
          <label class="field-label" for="fullname">Full Name</label>
          <input class="field-input" id="fullname" type="text" name="fullname" autocomplete="name">
          <span class="field-caret" aria-hidden="true"></span>
        </div>

        <div class="field" data-field>
          <img class="field-icon icon-mail" src="assets/chip-mail.png" alt="" aria-hidden="true">
          <label class="field-label" for="email">Email Address</label>
          <input class="field-input" id="email" type="email" name="email" autocomplete="email" inputmode="email">
          <span class="field-caret" aria-hidden="true"></span>
        </div>

        <div class="field" data-field>
          <img class="field-icon icon-key" src="assets/chip-key.png" alt="" aria-hidden="true">
          <label class="field-label" for="password">Password</label>
          <input class="field-input" id="password" type="password" name="password" autocomplete="new-password">
          <button type="button" class="field-icon eye" data-eye aria-label="Show password" aria-pressed="false"></button>
          <span class="field-caret" aria-hidden="true"></span>
        </div>

        <button type="submit" class="cta">Create Account</button>

        <p class="footer-link">Already have an account? <a href="signin.html">Log in</a></p>

      </form>
    </section>

    <!-- Illustration — painted ABOVE the card's left edge per design draw order -->
    <img class="illustration" src="assets/illustration.png" alt="">

  </main>
  <script src="js/states.js"></script>
</body>
</html>
